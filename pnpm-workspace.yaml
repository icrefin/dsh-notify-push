# pnpm 11 reads build-script approval from this file, not from package.json
# (`pnpm.onlyBuiltDependencies` there is warned about and ignored). esbuild's
# postinstall is what makes vitest and tsdown usable, so approve exactly that
# one rather than running every dependency's install script.
allowBuilds:
  esbuild: true
minimumReleaseAgeExclude:
  - '@deepseek-ai/cordis@4.0.5'
  - '@deepseek-ai/cosmokit@1.8.6'
  - '@deepseek-ai/dsh-client-locale@0.2.1-rc.3'
  - '@deepseek-ai/dsh-client-ui-settings-general@0.2.1-rc.3'
  - '@deepseek-ai/dsh-client-ui-settings@0.2.1-rc.3'
  - '@deepseek-ai/dsh-client-ui-slots@0.2.1-rc.3'
  - '@deepseek-ai/dsh-host-webserver@0.2.1-rc.3'
  - '@deepseek-ai/schemastery@3.18.5'
